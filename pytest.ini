# Minimal pytest config. NOT pyproject.toml - that is SPEC 0002 and out of scope here.
#
# Two jobs:
#  - `testpaths` stops a bare `pytest` from walking the whole repo. Before monoliths/ was
#    deleted, collection crashed outright on monoliths/v13fig/test_carve.py, which calls
#    `raise SystemExit(...)` at import time; `pytest --collect-only -q` reported "no tests
#    collected" rather than a number. Pinning testpaths means that cannot come back.
#  - Registering the markers makes `make test`'s `-m "not slow and not heavy and not real
#    and not r"` a real selection instead of a filter over names nothing declares.
[pytest]
testpaths = tests
# The repo root must be importable. `python -m pytest` puts cwd on sys.path but the
# `pytest` console script does not, so `make test` died with ModuleNotFoundError on
# `analyzers` while a bare `python -m pytest` passed. Setting it here means no caller has
# to remember PYTHONPATH=. - which every command in this repo's history has had to.
pythonpath = .
markers =
    slow: full statistical grids; excluded from the fast gate
    heavy: large end-to-end job runs; excluded from the fast gate
    real: needs the private dataset tree; never runs in CI
    r: needs Rscript plus the copula and randtests packages
